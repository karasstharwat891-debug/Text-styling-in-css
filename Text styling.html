<html>
    <head>
<style> 
    body{
        background-image: linear-gradient( rgb(90, 29, 29),rgb(240, 23, 23));
        color: white;
        font-family: 'Times New Roman', Times, serif;
    }

    .hero-name{
        font-size:60px ;
        font-weight:bold ;
        color: brown;
        text-shadow: 3px 3px black;
    }
    .tag-line{
        font-style:italic ;
        color:white ;
        text-transform: capitalize;
    }

    .label{
        text-transform: uppercase;
        text-decoration: underline;
        color: pink;
    }
    .power{
        font-weight: bold;
        color: pink;
    }
    .weakness{
        text-decoration: line-through;
        color: rgb(175, 175, 175);
    }
    .badge{
        font-size: 28px;
        font-weight: bold;
        color: gold;
        transform: rotate(15deg);
    }
    .made-by{
        font-weight: bold;
        font-style: underline;
        color: coral;
    }
</style>
    </head>

    <body>
        <center>
        <h1 class="hero-name">Daredevil</h1>
        <p class="tag-line">The most mysterious hero in marvel</p>

        <h2 class="label">Super powers</h2>
        <p class="power">Can see the Thermal radiation of his oppoonent</p>
        <p class="power">Can hide very well</p>

        <h2 class="label">Weakness</h2>
        <p class="weakness">He is blind</p>
        <p class="weakness">He is very emotional</p>

        <p class="badge">Top hero</p>

        <p class="made-by">Made by Karas</p>
    </center>


    </body>
</html>
